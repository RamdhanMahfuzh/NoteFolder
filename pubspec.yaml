name: notefolder
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  equatable: ^3.0.0
  flutter_bloc: ^8.1.3
  get_it: ^9.3.0
  flutter_svg: ^2.1.0
  flutter_staggered_grid_view: ^0.7.0
  go_router: ^14.8.1
  image_picker: ^1.1.2
  path: ^1.9.1
  sqflite: ^2.4.2+1
  sqflite_common_ffi: ^2.3.6
  sqflite_common_ffi_web: ^0.4.2+1
  dio: ^5.11.1
  local_auth: ^3.0.2
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  speech_to_text: ^7.4.0
  geolocator: ^14.0.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  share_plus: 10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: assets/logo.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/logo.png
  web:
    generate: true
    image_path: assets/logo.png
  windows:
    generate: true
    image_path: assets/logo.png
    icon_size: 256

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/logo.png
  android_12:
    color: "#FFFFFF"
    image: assets/logo.png

flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: lib/core/fonts/PlusJakartaSans-ExtraLight.ttf
          weight: 200
        - asset: lib/core/fonts/PlusJakartaSans-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: lib/core/fonts/PlusJakartaSans-Light.ttf
          weight: 300
        - asset: lib/core/fonts/PlusJakartaSans-LightItalic.ttf
          weight: 300
          style: italic
        - asset: lib/core/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: lib/core/fonts/PlusJakartaSans-Italic.ttf
          weight: 400
          style: italic
        - asset: lib/core/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: lib/core/fonts/PlusJakartaSans-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: lib/core/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: lib/core/fonts/PlusJakartaSans-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: lib/core/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: lib/core/fonts/PlusJakartaSans-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: lib/core/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
        - asset: lib/core/fonts/PlusJakartaSans-ExtraBoldItalic.ttf
          weight: 800
          style: italic
